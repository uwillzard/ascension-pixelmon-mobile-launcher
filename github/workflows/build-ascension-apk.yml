name: Build Ascension Pixelmon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Ascension overlay
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Amethyst/Pojav base
        run: |
          git clone --recurse-submodules https://github.com/AngelAuraMC/Amethyst-Android.git Amethyst-Android
          cd Amethyst-Android
          git checkout 4cf805a93124269b47f8a4ba27fcce36b79ab5ef
          git submodule update --init --recursive

      - name: Apply Ascension patches
        run: python3 tools/apply_ascension.py Amethyst-Android

      - name: Get bundled JRE 8 required by upstream build
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Generate upstream language list
        working-directory: Amethyst-Android
        run: ./scripts/languagelist_updater.sh

      - name: Build debug APK
        working-directory: Amethyst-Android
        run: gradle :app_pojavlauncher:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Ascension-Pixelmon-Mobile-Debug.apk
          sha256sum out/Ascension-Pixelmon-Mobile-Debug.apk > out/Ascension-Pixelmon-Mobile-Debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascension-Pixelmon-Mobile-Debug
          path: out/*
