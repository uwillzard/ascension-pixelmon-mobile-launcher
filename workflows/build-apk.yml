name: Build Ascension Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apply_ascension.py"
      - "branding/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Ascension customization
        uses: actions/checkout@v4

      - name: Checkout Amethyst Android
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          submodules: recursive
          path: amethyst

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Apply Ascension changes
        shell: bash
        run: python3 apply_ascension.py amethyst

      - name: Build APK
        working-directory: amethyst
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Ascension-Pixelmon-Mobile-v1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascension-Pixelmon-Mobile-APK
          path: dist/Ascension-Pixelmon-Mobile-v1-debug.apk
